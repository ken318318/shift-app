    <style>

        label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; color: #444; }
        input[type="text"], textarea, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 14px; background-color: #fff;}
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        
        .checkbox-group { margin-top: 5px; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #eee; display: flex; flex-wrap: wrap; gap: 10px;}

        .issue-item { border-bottom: 1px dashed #e0c97e; padding-bottom: 8px; margin-bottom: 8px; position: relative;}
        .issue-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .issue-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 5px; align-items: center;}
        .issue-row select, .issue-row input { padding: 8px; font-size: 13px; }
        .issue-row .table-num { flex: 1.5; min-width: 70px; }
        .issue-row .value { flex: 1.5; min-width: 70px; background: #fff; border: 1px solid #f5b041;}
        .box-row { display: flex; gap: 5px; margin-top: 5px;}
        .box-item { flex: 1; }
        .box-item span { font-size: 11px; color: #856404; font-weight: bold; display: block; margin-bottom: 2px;}
        .box-item input { width: 100%; padding: 6px; font-size: 13px; border: 1px solid #f5b041; border-radius: 4px;}
        .btn-add { background: #f5b041; color: white; border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; margin-top: 5px; display: inline-block; font-weight: bold;}
        button.submit-btn { width: 100%; padding: 14px; margin-top: 25px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold;}
        button.submit-btn:active { background: #1557b0; }
        #result { margin-top: 20px; color: #2ecc71; text-align: center; font-weight: bold; }
        .record-card { background: #fff; border: 1px solid #e0e0e0; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .record-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; font-size: 14px; }
        .record-data { font-size: 13px; color: #555; margin-bottom: 8px; background: #f4f6f8; padding: 8px; border-radius: 4px;}
        .issue-data { font-size: 13px; margin-bottom: 8px; padding: 8px; border-radius: 4px; line-height: 1.5; display: flex; justify-content: space-between; align-items: center;}
        .record-note { font-size: 14px; white-space: pre-wrap; line-height: 1.5; color: #222;}
        .status-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; color: white; white-space: nowrap;}
        .status-pending { background: #e67c73; }
        .status-processing { background: #f5b041; }
        .status-done { background: #2ecc71; }
        .status-mail { background: #9c27b0; }
        .issue-status { padding: 6px; font-size: 12px; border-radius: 6px; border: 1px solid #ccc; background: #fff; color: #d32f2f; font-weight: bold;}
        .pending-card { background: #fff8e1; border-left: 4px solid #ffa000; padding: 10px; margin-bottom: 10px; border-radius: 4px; font-size: 13px;}
        .btn-remove { background: #ff4d4f; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: absolute; right: 0; top: 0;}
    </style>

    <div class="row">

    <div id="nfc-input-area">

<script>

const tableDict = {};
rawTableList.split(',').forEach(item => {
    let str = item.trim();
    if(str) tableDict[str.replace(/[^0-9]/g, '')] = str; 
});

function autoFillTable(el) {
    let val = el.value.trim();
    if (/^\d+$/.test(val)) { 
        if (tableDict[val]) el.value = tableDict[val]; 
        else if (val.length >= 4) el.value = 'NB' + val; 
    }
}

function transformInputs() {
    document.querySelectorAll('.prefix').forEach(sel => {
        sel.style.display = 'none'; 
        if (!sel.nextElementSibling || !sel.nextElementSibling.classList.contains('note-input')) {
            let note = document.createElement('input');
            note.type = 'text';
            note.className = 'note-input';
            note.placeholder = '備註(選填)';
            note.style.cssText = 'flex: 1.5; padding: 8px; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; margin-left: 5px;';
            sel.parentNode.insertBefore(note, sel.nextSibling);
        }
    });
    document.querySelectorAll('.table-num, .venue-location').forEach(inp => {
        inp.placeholder = '輸入數字(如0201)';
        inp.setAttribute('oninput', 'autoFillTable(this)');
    });
}

function loadPendingIssues() {
    fetch('/api/pending_issues').then(res => res.json()).then(data => {
        let issues = data.issues; let doneSet = data.done_items || []; 
        let container = document.getElementById('pending-container');
        let listDiv = document.getElementById('pending-list');
        if (issues.length === 0) { container.style.display = 'none'; document.getElementById('home-pending-container').style.display = 'none'; return; }
        container.style.display = 'block';
        let html = ""; let totalItems = 0; let seenItems = new Set(); window.globalGroupedItems = {}; 
        issues.forEach(issue => {
            let timeStr = issue.created_at ? new Date(issue.created_at).toLocaleString('zh-HK') : '';
            let addItem = (type, text) => {
                if (!text) return;
                if (type === '場面' && text.includes('位置:')) {
                    let parts = text.split('位置:');
                    if (parts.length === 2) {
                        let beforePos = parts[0]; let afterPos = parts[1];  
                        let statusMatch = afterPos.match(/\[狀態:.*?\]/); let statusStr = statusMatch ? statusMatch[0] : '';
                        let tablesStr = afterPos.replace(/\[狀態:.*?\]/g, '').trim();
                        if (tablesStr.includes(',') || tablesStr.includes('，')) {
                            let tables = tablesStr.split(/[,，]/).map(t => t.trim()).filter(Boolean);
                            if (tables.every(t => /^[A-Za-z]{2,4}\d+$/i.test(t))) {
                                tables.forEach(table => addItem(type, `${beforePos}位置: ${table} ${statusStr}`.trim())); return; 
                            }
                        }
                    }
                }
                let statusMatch = text.match(/\[狀態:(.*?)\]/); let currentStatus = statusMatch ? statusMatch[1] : '待處理';
                if (currentStatus === '已處理') return; 
                let clean = text.replace(/\[狀態:.*?\]/g, '').replace('⚠️', '').replace('✅', '').trim();
                if (!clean) return;
                let checkText = `${type} - ${clean}`;
                if (doneSet.includes(checkText) || seenItems.has(checkText)) return;
                seenItems.add(checkText);
                let badgeColor = currentStatus === '已 Send mail' ? '#9c27b0' : (currentStatus === '已通知相關部門跟進' ? '#e67c73' : '#f5b041');
                let itemHtml = `<div class="pending-item-row" data-text="${checkText}" style="display:flex; align-items:center; background:#ffebee; padding:10px; margin-bottom:5px; border-radius:6px; border: 1px solid #ffcdd2;"><input type="checkbox" class="pending-checkbox" data-text="${checkText}" style="width:20px; height:20px; margin-right:10px;"><div style="font-size:13px; color:#d32f2f; flex:1;"><strong>⚠️ ${checkText}</strong><span style="background:${badgeColor}; color:white; padding:2px 6px; border-radius:4px; font-size:11px; margin-left:5px;">${currentStatus}</span><br><span style="font-size:11px; color:#888;">交更時間: ${timeStr}</span></div></div>`;
                let cat = "其他問題"; if (checkText.includes('Lux')) cat = "💡 Lux 異常"; else if (checkText.includes('溫度')) cat = "🌡️ 溫度"; else if (checkText.includes('分貝')) cat = "🔊 分貝"; else if (checkText.includes('場面 - [櫈')) cat = "🪑 櫈/座位"; else if (checkText.includes('場面 - [')) { let match = checkText.match(/\[(.*?)\]/); if (match) { let parts = match[1].split('-'); cat = "🛠️ " + parts[0].trim() + (parts.length >= 2 ? " - " + parts[1].trim() : ""); } else { cat = "🛠️ 場面"; } }
                if (!window.globalGroupedItems[cat]) window.globalGroupedItems[cat] = [];
                window.globalGroupedItems[cat].push(`<div style="margin-bottom:8px;"><div style="font-size:11px; color:#856404; margin-bottom:3px;">👤 ${issue.name}</div>${itemHtml}</div>`);
                totalItems++;
            };
            if (issue.lux_issue) addItem('Lux', issue.lux_issue);
            if (issue.temp_issue) addItem('溫度', issue.temp_issue);
            if (issue.db_issue) addItem('分貝', issue.db_issue);
            if (issue.note && issue.note.includes('【場面問題】')) issue.note.split('【場面問題】')[1].split('【早前')[0].trim().split('\n').forEach(line => { if(line.trim()) addItem('場面', line); });
        });
        let finalHtml = "";
        for (let cat in window.globalGroupedItems) finalHtml += `<div class="pending-card" style="border-left: 4px solid #ffa000; margin-bottom: 15px;"><details style="background: #fff; border: 1px solid #eee; border-radius: 6px; padding: 5px;"><summary style="cursor: pointer; font-weight: bold; color: #856404; padding: 5px;">${cat} (${window.globalGroupedItems[cat].length} 項)</summary><div style="padding: 5px 0 0 0;">${window.globalGroupedItems[cat].join('')}</div></details></div>`;
        if (totalItems === 0) { container.style.display = 'none'; document.getElementById('home-pending-container').style.display = 'none'; } 
        else {
            document.getElementById('pending-title').innerHTML = `⚠️ 有 ${totalItems} 項早前已通知相關部門跟進(尚待解決) (點擊展開剔選)`;
            listDiv.innerHTML = finalHtml;
            document.getElementById('home-pending-container').style.display = 'block';
            document.getElementById('home-pending-title').innerHTML = `⚠️ 有 ${totalItems} 項早前已通知相關部門跟進(尚待解決) (點擊展開查看)`;
            document.getElementById('home-pending-list').innerHTML = finalHtml.replace(/<input type="checkbox"[^>]*>/g, '');
        }
    }).catch(err => console.error(err));
}

                            <div><strong>${r.name} (${r.shift})</strong>${timeStr}</div>
                            <div>
                                <button onclick="editRecord(this)" data-id="${r.id}" data-note="${safeNote}" data-status="${r.status}" style="background: #f5b041; color: white; padding: 5px 10px; border-radius: 4px; border: none; margin-right: 5px; font-size: 12px;">✏️ 修改</button>
                                <button onclick="deleteRecord(${r.id})" style="background: #e74c3c; color: white; padding: 5px 10px; border-radius: 4px; border: none; font-size: 12px;">🗑️ 刪除</button>
                            </div>
                        </div>
                        ${doneOldHtml}
                        <div class="record-note" style="margin-top: 10px;">${mainNote}</div>
                    </div>
                `;
            });
            listDiv.innerHTML = html;
        }).catch(error => console.error("讀取失敗:", error));
    }

    function submitForm() {
        let data = {
            name: document.getElementById('staffName').value, shift: document.getElementById('shiftType').value,
            lux: document.getElementById('lux').value, temp: document.getElementById('temp').value, bgm: document.getElementById('bgm').value,
            checklist: document.getElementById('nfc-status').value === '有異常' ? `NFC異常` : `NFC正常`,
            status: "待處理", follower: Array.from(document.querySelectorAll('.follower-item:checked')).map(cb => cb.value).join(', ') || '無',
            note: document.getElementById('notes').value, lux_issue: "", temp_issue: "", db_issue: ""
        };
        if (!data.name) { alert("請選擇交更人！"); return; }
        
        let luxIssueArr = []; document.querySelectorAll('.lux-item').forEach(item => {
            let t = item.querySelector('.lux-table').value; let note = item.querySelector('.note-input')?.value || '';
            if(t) luxIssueArr.push(`${t} ${note?'('+note+')':''} Box1:${item.querySelector('.lux-box1').value} [${item.querySelector('.issue-status').value}]`);
        });
        data.lux_issue = luxIssueArr.join(' | ');

        let venueIssues = []; document.querySelectorAll('.venue-item').forEach(item => {
            let cat = item.querySelector('.venue-category').value; let prob = item.querySelector('.venue-problem').value;
            let locs = []; item.querySelectorAll('.venue-loc-row').forEach(locRow => {
                let t = locRow.querySelector('.venue-location').value; let note = locRow.querySelector('.note-input')?.value || '';
                if(t) locs.push(`${t} ${note?'('+note+')':''}`);
            });
            if (locs.length > 0) venueIssues.push(`[${cat} - ${prob}] 位置: ${locs.join(', ')} [狀態:${item.querySelector('.issue-status').value}]`);
        });
        if(venueIssues.length > 0) data.note += `\n\n【場面問題】\n` + venueIssues.join('\n');

        fetch('/api/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
        .then(res => res.json()).then(res => { alert("✅ 交更成功！"); showList(); })
        .catch(error => alert("❌ 連線失敗！"));
    }

    document.addEventListener("DOMContentLoaded", function() {
        fetch('/api/get_configs').then(res => res.json()).then(data => {
            venueCategories = data; 
            let firstVenue = document.querySelector('.venue-category'); if(firstVenue) initVenueCategory(firstVenue);
            transformInputs(); 
        }).catch(err => { console.error(err); transformInputs(); });
    });
    </script>
</body>
</html>
