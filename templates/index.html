<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>BS交更系統</title>
<style>
body{font-family:sans-serif;background:#f0f2f5;padding:15px;margin:0}
.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1);max-width:500px;margin:auto;margin-bottom:20px}
h2{text-align:center;color:#333;margin-top:0}
label{display:block;margin-top:15px;font-weight:bold;font-size:14px;color:#444}
input[type="text"],textarea,select{width:100%;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-family:inherit;font-size:14px;background-color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:140px}
.checkbox-group{margin-top:5px;background:#f8f9fa;padding:10px;border-radius:8px;border:1px solid #eee;display:flex;flex-wrap:wrap;gap:10px}
.checkbox-group label{font-weight:normal;display:flex;align-items:center;margin-top:0;cursor:pointer;font-size:13px;width:30%}
.checkbox-group input{margin-right:8px;width:16px;height:16px}
.issue-group{display:none;background:#fff3cd;padding:10px;border-radius:8px;border:1px solid #ffeeba;margin-top:5px}
.issue-title{font-size:12px;color:#856404;margin-bottom:5px;font-weight:bold}
.issue-item{border-bottom:1px dashed #e0c97e;padding-bottom:8px;margin-bottom:8px;position:relative}
.issue-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.issue-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px;align-items:center;width:100%}
.issue-row select,.issue-row input{padding:8px;font-size:13px;height:38px;box-sizing:border-box;margin:0}
.venue-category,.venue-problem{flex:1 1 0px;min-width:0;width:50%;height:38px;box-sizing:border-box;text-overflow:ellipsis}
.issue-row .table-num{flex:1.5;min-width:70px}
.issue-row .value{flex:1.5;min-width:70px;background:#fff;border:1px solid #f5b041}
.box-row{display:flex;gap:5px;margin-top:5px}
.box-item{flex:1}
.box-item span{font-size:11px;color:#856404;font-weight:bold;display:block;margin-bottom:2px}
.box-item input{width:100%;padding:6px;font-size:13px;border:1px solid #f5b041;border-radius:4px}
.btn-add{background:#f5b041;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;margin-top:5px;display:inline-block;font-weight:bold}
button.submit-btn{width:100%;padding:14px;margin-top:25px;background:#1a73e8;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;font-weight:bold}
.record-card{background:#fff;border:1px solid #e0e0e0;padding:15px;margin-bottom:15px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.record-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;font-size:14px;gap:10px}
.record-data{font-size:13px;color:#555;margin-bottom:8px;background:#f4f6f8;padding:8px;border-radius:4px}
.issue-data{font-size:14px;margin-bottom:8px;padding:10px;border-radius:4px;line-height:1.5;display:grid;grid-template-columns:1fr auto;align-items:start;gap:8px}
.issue-data span:first-child{min-width:0;word-break:break-word}
.issue-data span:last-child{align-self:start}
.record-note{font-size:14px;white-space:pre-wrap;line-height:1.5;color:#222}
.status-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;color:#fff;white-space:nowrap}
.status-pending{background:#e67c73}
.status-done{background:#2ecc71}
.issue-status{padding:6px;font-size:12px;border-radius:6px;border:1px solid #ccc;background:#fff;color:#d32f2f;font-weight:bold}
.pending-card{background:#fff8e1;border-left:4px solid #ffa000;padding:10px;margin-bottom:10px;border-radius:4px;font-size:13px}
.btn-remove{background:#ff4d4f;color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:absolute;right:0;top:0}
@media (max-width:500px){.card{padding:12px!important}.record-header{padding:8px!important}}
</style>
</head>

function parseNote(t){let r={main:"",venue:"",doneOld:"",pendingOld:""};if(!t)return r;let x=t;let vm=x.match(/【場面問題】([\s\S]*?)(?=【|$)/);if(vm){r.venue=vm[1].trim();x=x.replace(vm[0],'');}let dm=x.match(/【早前已處理】([\s\S]*?)(?=【|$)/);if(dm){r.doneOld=dm[1].trim();x=x.replace(dm[0],'');}let pm=x.match(/【早前未處理】([\s\S]*?)(?=【|$)/);if(pm){r.pendingOld=pm[1].trim();x=x.replace(pm[0],'');}r.main=x.trim();return r;}

NfcIssue();if(d.nfcIssue&&d.nfcIssue.length){let c=document.getElementById('nfc-container');c.innerHTML='';d.nfcIssue.forEach(i=>{let h=['Box 1','Box 2','Box 3','Box 5','Box 6','ALL'].map(b=>`<label style="width:30%"><input type="checkbox" value="${b}" class="nfc-box" ${i.boxes.includes(b)?'checked':''}> ${b}</label>`).join('');c.insertAdjacentHTML('beforeend',`<div class="issue-item nfc-item"><button type="button" class="btn-remove" onclick="this.parentElement.remove()">X</button><div class="issue-row"><input type="text" class="table-num nfc-table" value="${i.t}"></div><div class="checkbox-group" style="background:transparent;border:none;padding:0;margin-top:5px;gap:5px">${h}</div><div class="issue-row" style="margin-top:8px"><select class="issue-status"><option value="已處理" ${i.s==='已處理'?'selected':''}>已處理</option><option value="已 Send mail" ${i.s==='已 Send mail'?'selected':''}>已 Send mail</option><option value="已通知相關部門跟進" ${i.s==='已通知相關部門跟進'?'selected':''}>已通知相關部門跟進</option><option value="待處理" ${i.s==='待處理'?'selected':''}>待處理</option></select></div></div>`);});}}}if(d.venue&&d.venue.length){let c=document.getElementById('venue-container');c.innerHTML='';d.venue.forEach(i=>{let html=`<div class="issue-item venue-item" style="border-bottom-color:#90caf9"><div class="issue-row"><select class="venue-category" onchange="updateVenueProblem(this)"></select><select class="venue-problem"></select></div><div class="venue-location-container">`;if(!i.locs.length){html+=`<div class="issue-row venue-loc-row" style="margin-top:5px"><input type="text" class="table-num venue-location" placeholder="輸入數字(如0201)" style="flex:1.5"><button type="button" class="btn-add" style="background:#2ecc71;margin-top:0;padding:8px" onclick="addVenueLocation(this)">+</button></div>`;}else{i.locs.forEach((loc,idx)=>{html+=`<div class="issue-row venue-loc-row" style="margin-top:5px;position:relative"><input type="text" class="table-num venue-location" placeholder="輸入數字(如0201)" style="flex:1.5;margin- function togglePending(){let l=document.getElementById('pending-list');let a=document.getElementById('pending-arrow');if(l.style.display==='none'){l.style.display='block';a.innerHTML='▲ 收起';}else{l.style.display='none';a.innerHTML='▼ 展開';}}

function toggleIssue(t){let s=document.getElementById(t);let g=document.getElementById(t+'-issue-group');if(t==='lux'){if(s.value==='< 450'||s.value==='> 650')g.style.display='block';else g.style.display='none';}else{if(s.value.includes('偏高')||s.value.includes('偏低'))g.style.display='block';else g.style.display='none';}}

function toggleSkip(t){let i=document.getElementById('skip-'+t).checked;document.getElementById(t+'-input-area').style.display=i?'none':'block';}
function initVenueCategory(s){s.innerHTML=`<option value="">-- 請選擇 (如不需要請留空) --</option>`+Object.keys(venueCategories).map(k=>`<option value="${k}">${k}</option>`).join('');updateVenueProblem(s);}

function toggleSelectAll(c){let card=c.closest('.pending-card');if(!card)return;card.querySelectorAll('.pending-checkbox').forEach(x=>{if(x.offsetParent!==null)x.checked=c.checked;});}
function loadPendingIssues(){fetch('/api/pending_issues').then(r=>r.json()).then(d=>{let issues=d.issues;let doneSet=d.done_items||[];let c=document.getElementById('pending-container');let l=document.getElementById('pending-list');if(issues.length===0){c.style.display='none';document.getElementById('home-pending-container').style.display='none';l.innerHTML='';document.getElementById('home-pending-list').innerHTML='';return;}let editData=editingRecordId?allRecords.find(x=>x.id==editingRecordId):null;let doneInEdit=[];if(editData&&editData.note){let p=parseNote(editData.note);if(p.doneOld)doneInEdit=p.doneOld.split('\n').map(s=>s.trim()).filter(s=>s).map(s=>s.replace(/\[狀態:.*?\]/g,'').trim().toUpperCase());}c.style.display='block';let total=0;let seen=new Set();window.globalGroupedItems={};issues.forEach(iss=>{let tStr=iss.created_at?new Date(iss.created_at).toLocaleString('zh-HK'):'';let addItem=(type,text,rid)=>{if(!text)return;if(type==='場面'&&text.includes('位置:')){let pts=text.split('位置:');if(pts.length===2){let bef=pts[0];let aft=pts[1];let sm=aft.match(/\[狀態:.*?\]/);let sStr=sm?sm[0]:'';let tbls=aft.replace(/\[狀態:.*?\]/g,'').trim();if(tbls.includes(',')||tbls.includes('，')){let ts=tbls.split(/[,，]/).map(x=>x.trim()).filter(Boolean);if(ts.every(x=>/^[A-Za-z]{2,4}\d+$/i.test(x))){ts.forEach(tb=>addItem(type,`${bef}位置: ${tb} ${sStr}`.trim(),rid));return;}}}}let sm=text.match(/\[狀態:(.*?)\]/);let cStat=sm?sm[1]:'待處理';if(cStat==='已處理')return;let cl=text.replace(/\[狀態:.*?\]/g,'').replace('⚠️','').replace('✅','').trim();if(!cl)return;let checkTxt=`${type} - ${cl}`.toUpperCase();let dataTxt=`${type} - ${cl} [狀態:${cStat}]`;if(seen.has(checkTxt))return;let inDone=doneSet.includes(checkTxt);let isInEdit=doneInEdit.some(x=>x.includes(checkTxt)||checkTxt.includes(x));if(inDone&&!isInEdit)return;seen.add(checkTxt);let bColor=cStat==='已 Send mail'?'#9c27b0':(cStat==='已通知相關部門跟進'?'#e67c73':'#f5b041');let iHtml=`<div class="pending-item-row" data-text="${dataTxt}" style="display:flex;align-items:center;background:#ffebee;padding:10px;margin-bottom:5px;border-radius:6px;border:1px solid #ffcdd2"><input type="checkbox" class="pending-checkbox" data-text="${dataTxt}" style="width:20px;height:20px;margin-right:10px"><div style="font-size:13px;color:#d32f2f;flex:1;line-height:1.5;padding:5px 0"><strong>⚠️ ${type} - ${cl}</strong><span style="background:${bColor};color:#fff;padding:2px 6px;border-radius:4px;font-size:11px;margin-left:5px;display:inline-block;white-space:nowrap">${cStat}</span><br><span style="font-size:11px;color:#888">交更時間: ${tStr}</span></div></div>`;let cat="其他問題";if(checkTxt.includes('LUX'))cat="💡 Lux 異常";else if(checkTxt.includes('溫度'))cat="🌡️ 溫度";else if(checkTxt.includes('分貝'))cat="🔊 分貝";else if(checkTxt.includes('NFC'))cat="📡 NFC 異常";else if(checkTxt.includes('場面 - [櫈'))cat="🪑 櫈/座位";else if(checkTxt.includes('場面 - [')){let m=checkTxt.match(/\[(.*?)\]/);if(m){let p=m[1].split('-');cat="🛠️ "+p[0].trim()+(p.length>=2?" - "+p[1].trim():"");}else{cat="🛠️ 場面";}}if(!window.globalGroupedItems[cat])window.globalGroupedItems[cat]=[];window.globalGroupedItems[cat].push(`<div style="margin-bottom:8px"><div style="font-size:11px;color:#856404;margin-bottom:3px">👤 ${iss.name}</div>${iHtml}</div>`);total++;};if(iss.lux_issue)addItem('Lux',iss.lux_issue,iss.id);if(iss.temp_issue)addItem('溫度',iss.temp_issue,iss.id);if(iss.db_issue)addItem('分貝',iss.db_issue,iss.id);if(iss.checklist&&iss.checklist.includes('NFC異常:')){let p=iss.checklist.split(' | ');p.forEach(x=>{if(x.startsWith('NFC異常:')){let nt=x.replace('NFC異常:','').trim();if(nt)addItem('NFC',nt,iss.id);}});}let pIss=parseNote(iss.note||"");if(pIss.venue){if(iss.id!==editingRecordId){pIss.venue.split('\n').forEach(ln=>{if(ln.trim())addItem('場面',ln,iss.id);});}}if(pIss.pendingOld){pIss.pendingOld.split('\n').forEach(ln=>{ln=ln.trim();if(ln){let m=ln.match(/^(Lux|溫度|分貝|NFC|場面)\s*-\s*/);let t=m?m[1]:'場面';let txt=m?ln.slice(m[0].length):ln;addItem(t,txt,iss.id);}});}});let fHtml="";for(let cat in window.globalGroupedItems){fHtml+=`<div class="pending-card" style="border-left:4px solid #ffa000;margin-bottom:15px"><details style="background:#fff;border:1px solid #eee;border-radius:6px;padding:5px"><summary style="cursor:pointer;font-weight:bold;color:#856404;padding:5px;display:flex;align-items:center"><input type="checkbox" class="select-all-cb" onchange="toggleSelectAll(this)" onclick="event.stopPropagation()" style="width:18px;height:18px;margin-right:10px;cursor:pointer">${cat} (${window.globalGroupedItems[cat].length} 項)</summary><div style="padding:5px 0 0 0">${window.globalGroupedItems[cat].join('')}</div></details></div>`;}if(total===0){c.style.display='none';l.innerHTML='';document.getElementById('home-pending-container').style.display='none';document.getElementById('home-pending-list').innerHTML='';}else{document.getElementById('pending-title').innerHTML=`⚠️ 有 ${total} 項早前已通知相關部門跟進(尚待解決) (點擊展開剔選)`;l.innerHTML=fHtml;document.getElementById('home-pending-container').style.display='block';document.getElementById('home-pending-title').innerHTML=`⚠️ 有 ${total} 項早前已通知相關部門跟進(尚待解決) (點擊展開查看)`;document.getElementById('home-pending-list').innerHTML=fHtml.replace(/<input type="checkbox"[^>]*>/g,'');}if(editingRecordId){let r=allRecords.find(x=>x.id==editingRecordId);if(r&&r.note&&r.note.includes('【早前已處理】')){let p=parseNote(r.note);let dL=p.doneOld.split('\n').map(x=>x.replace(/\[狀態:.*?\]/g,'').trim().toUpperCase()).filter(x=>x);document.querySelectorAll('.pending-checkbox').forEach(cb=>{let cbT=cb.getAttribute('data-text');let clCb=cbT.split(' [狀態:')[0].trim().toUpperCase();if(dL.some(x=>x.includes(clCb)||clCb.includes(x)))cb.checked=true;});}}}).catch(e=>console.error(e));}
function formatIssueText(t,p,s){if(!t)return"";let isD=(s==='已處理');let dS=isD?'已處理':'未處理';let bC=isD?'#e8f5e9':'#ffebee';let tC=isD?'#2e7d32':'#d32f2f';let pI=isD?'✅ ':'⚠️ ';let dP=pI+p;let bClass=isD?'status-done':'status-pending';return `<div class="issue-data" style="background:${bC};color:${tC}"><span><strong>${dP}</strong> ${t}</span><span class="status-badge ${bClass}">${dS}</span></div>`;}
function displayRecords(){fetch('/api/records').then(r=>r.json()).then(recs=>{allRecords=recs;let l=document.getElementById('recordList');if(recs.length===0){l.innerHTML="<p style='color:#888;text-align:center'>暫時未有紀錄。</p>";return;}let h="";recs.forEach((r,i)=>{let doneL=[],pendL=[],doneO="";let pI=(t,p)=>{if(!t)return;let m=t.match(/\[狀態:(.*?)\]/);let s=m?m[1]:'待處理';let cT=t.replace(/\[狀態:.*?\]/g,'').trim();if(s==='已處理')doneL.push(formatIssueText(cT,p,s));else pendL.push(formatIssueText(cT,p,s));};if(r.lux_issue)pI(r.lux_issue,'Lux -');if(r.temp_issue)pI(r.temp_issue,'溫度 -');if(r.db_issue)pI(r.db_issue,'分貝 -');let cH="";if(r.checklist){let x=r.checklist.split(' | ');x.forEach(y=>{if(y.includes('異常'))pI(y.replace('NFC異常: ','').trim(),'NFC -');});}let pN=parseNote(r.note||"");let mN=pN.main;if(pN.venue)pN.venue.split('\n').forEach(ln=>{ln=ln.trim();if(ln&&!ln.startsWith('⚠️')&&!ln.startsWith('✅'))pI(ln,'場面 -');});if(pN.doneOld)pN.doneOld.split('\n').forEach(ln=>{if(ln.trim())doneO+=`<div class="issue-data" style="background:#e8f5e9;color:#2e7d32;padding:8px;margin-bottom:5px;border-radius:4px"><span>✅ 舊問題已處理: ${ln.trim()}</span></div>`;});if(pN.pendingOld)pN.pendingOld.split('\n').forEach(ln=>{ln=ln.trim();if(ln)pendL.push(formatIssueText(ln,'','未處理'));});let tS=r.created_at?`<div style="font-size:12px;color:#888;font-weight:normal;margin-top:4px">🕒 ${new Date(r.created_at).toLocaleString('zh-HK')}</div>`:"";let lS=(!r.lux_issue&&r.lux!=='450-650')?`Lux: ${r.lux}`:'Lux數值大致在於450-650之間';let tStr=(r.temp==='正常 (22.5-24.5)'||r.temp==='正常'||r.temp_issue)?'溫度數值大致在於 22.5°-24.5°':`溫度: ${r.temp}`;let bS=(r.bgm==='正常 (65-75)'||r.bgm==='正常'||r.db_issue)?'分貝數值大致在於 65-75':`分貝: ${r.bgm}`;let dH=`<div class="record-data">📊 ${lS} | ${tStr} | ${bS}</div>`;let fH="";if(r.follower&&r.follower!=='無'){let ns=r.follower.split(', ');let iH=ns.map(n=>{let iC=(n.includes('Carman')||n.includes('Stella'))?'#e91e63':'#1a73e8';return `<span style="margin-right:8px;font-weight:bold;color:${iC}"><svg viewBox="0 0 24 24" width="14" height="14" fill="${iC}" style="vertical-align:text-top;margin-right:2px"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>${n}</span>`;}).join('');fH=`<div class="record-data" style="background:#fff3cd;color:#856404;display:flex;align-items:center">👤 跟進人: <div style="margin-left:5px">${iH}</div></div>`;}let dv=i>0?`<hr style="border:0;height:8px;background:#d1d5db;margin:30px 0;border-radius:4px">`:"";let bH=`<button onclick="editRecord(${r.id})" style="background:#f5b041;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12px;margin-right:5px">✏️ 修改</button>`;if(isAdmin)bH+=`<button onclick="deleteRecord(${r.id})" style="background:#e74c3c;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12px">🗑️ 刪除</button>`;h+=`${dv}<div class="record-card"><div class="record-header" style="background:#f8f9fa;padding:10px;border-radius:6px 6px 0 0;margin:-15px -15px 15px -15px;border-bottom:2px solid #1a73e8"><div style="flex:1;min-width:0"><strong style="font-size:16px;word-break:break-word">${r.name} (${r.shift})</strong>${tS}</div><div style="display:flex;flex-shrink:0;gap:5px;align-items:center">${bH}</div></div>${dH}${cH}${doneL.join('')}${doneO}${pendL.join('')}${fH}<div class="record-note" style="margin-top:10px">${mN}</div></div>`;});l.innerHTML=h;}).catch(e=>console.error(e));}
function editRecord(id){let r=allRecords.find(x=>x.id==id);if(!r)return;resetForm(false);document.getElementById('list-container').style.display='none';document.getElementById('form-container').style.display='block';editingRecordId=id;document.getElementById('staffName').value=r.name;document.getElementById('shiftType').value=r.shift;if(r.follower&&r.follower!=='無'){let ns=r.follower.split(', ');document.querySelectorAll('.follower-item').forEach(c=>{if(ns.includes(c.value))c.checked=true;});}if(!r.lux){document.getElementById('skip-lux').checked=true;document.getElementById('lux-input-area').style.display='none';}else{document.getElementById('skip-lux').checked=false;document.getElementById('lux-input-area').style.display='block';document.getElementById('lux').value=r.lux;if(r.lux==='< 450'||r.lux==='> 650'){document.getElementById('lux-issue-group').style.display='block';if(r.lux_issue){let li=r.lux_issue.split(' | ');let c=document.getElementById('lux-container');c.innerHTML='';li.forEach(x=>{let m=x.match(/(.*?)\s*\((.*?)\)\s*\[狀態:(.*?)\]/);if(m){let tN=m[1].trim(),bS=m[2],st=m[3].trim(),b1='',b3='',b6='';bS.split(',').forEach(b=>{if(b.includes('Box 1:'))b1=b.replace('Box 1:','').trim();if(b.includes('Box 3:'))b3=b.replace('Box 3:','').trim();if(b.includes('Box 6:'))b6=b.replace('Box 6:','').trim();});c.insertAdjacentHTML('beforeend',`<div class="issue-item lux-item"><button type="button" class="btn-remove" onclick="this.parentElement.remove()">X</button><div class="issue-row"><input type="text" class="table-num lux-table" value="${tN}"></div><div class="box-row"><div class="box-item"><span>Box 1</span><input type="text" class="lux-box1" value="${b1}"></div><div class="box-item"><span>Box 3</span><input type="text" class="lux-box3" value="${b3}"></div><div class="box-item"><span>Box 6</span><input type="text" class="lux-box6" value="${b6}"></div></div><div class="issue-row" style="margin-top:8px"><select class="issue-status"><option value="已處理" ${st==='已處理'?'selected':''}>已處理</option><option value="已 Send mail" ${st==='已 Send mail'?'selected':''}>已 Send mail</option><option value="已通知相關部門跟進" ${st==='已通知相關部門跟進'?'selected':''}>已通知相關部門跟進</option><option value="待處理" ${st==='待處理'?'selected':''}>待處理</option></select></div></div>`);}});}}else{document.getElementById('lux-issue-group').style.display='none';}}if(!r.temp){document.getElementById('skip-temp').checked=true;document.getElementById('temp-input-area').style.display='none';}else{document.getElementById('skip-temp').checked=false;document.getElementById('temp-input-area').style.display='block';document.getElementById('temp').value=r.temp;if(r.temp.includes('偏低')||r.temp.includes('偏高')){document.getElementById('temp-issue-group').style.display='block';if(r.temp_issue){let ti=r.temp_issue.split(' | ');let c=document.getElementById('temp-container');c.innerHTML='';ti.forEach(x=>{let m=x.match(/(.*?)\s*\(數值:\s*(.*?)\)\s*\[狀態:(.*?)\]/);if(m){let tN=m[1].trim(),v=m[2].trim(),st=m[3].trim();c.insertAdjacentHTML('beforeend',`<div class="issue-item temp-item"><button type="button" class="btn-remove" onclick="this.parentElement.remove()">X</button><div class="issue-row"><input type="text" class="table-num temp-table" value="${tN}"><input type="text" class="value temp-value" value="${v}"></div><div class="issue-row" style="margin-top:8px"><select class="issue-status"><option value="已處理" ${st==='已處理'?'selected':''}>已處理</option><option value="已 Send mail" ${st==='已 Send mail'?'selected':''}>已 Send mail</option><option value="已通知相關部門跟進" ${st==='已通知相關部門跟進'?'selected':''}>已通知相關部門跟進</option><option value="待處理" ${st==='待處理'?'selected':''}>待處理</option></select></div></div>`);}});}}else{document.getElementById('temp-issue-group').style.display='none';}}if(!r.bgm){document.getElementById('skip-bgm').checked=true;document.getElementById('bgm-input-area').style.display='none';}else{document.getElementById('skip-bgm').checked=false;document.getElementById('bgm-input-area').style.display='block';document.getElementById('bgm').value=r.bgm;if(r.bgm.includes('偏低')||r.bgm.includes('偏高')){document.getElementById('bgm-issue-group').style.display='block';if(r.db_issue){let bi=r.db_issue.split(' | ');let c=document.getElementById('bgm-container');c.innerHTML='';bi.forEach(x=>{let m=x.match(/(.*?)\s*\(數值:\s*(.*?)\)\s*\[狀態:(.*?)\]/);if(m){let tN=m[1].trim(),v=m[2].trim(),st=m[3].trim();c.insertAdjacentHTML('beforeend',`<div class="issue-item bgm-item"><button type="button" class="btn-remove" onclick="this.parentElement.remove()">X</button><div class="issue-row"><input type="text" class="table-num bgm-table" value="${tN}"><input type="text" class="value bgm-value" value="${v}"></div><div class="issue-row" style="margin-top:8px"><select class="issue-status"><option value="已處理" ${st==='已處理'?'selected':''}>已處理</option><option value="已 Send mail" ${st==='已 Send mail'?'selected':''}>已 Send mail</option><option value="已通知相關部門跟進" ${st==='已通知相關部門跟進'?'selected':''}>已通知相關部門跟進</option><option value="待處理" ${st==='待處理'?'selected':''}>待處理</option></select></div></div>`);}});}}else{document.getElementById('bgm-issue-group').style.display='none';}}if(!r.checklist){document.getElementById('skip-nfc').checked=true;document.getElementById('nfc-input-area').style.display='none';}else{document.getElementById('skip-nfc').checked=false;document.getElementById('nfc-input-area').style.display='block';let p=r.checklist.split(' | ');let hS=p.find(x=>x.includes('NFC正常:')),iS=p.find(x=>x.includes('NFC異常:'));if(hS){let h=hS.replace('NFC正常:','').trim();document.getElementById('nfc-hall-select').value=h;}if(iS){document.getElementById('nfc-status').value='有異常';document.getElementById('nfc-issue-group').style.display='block';let ni=iS.replace('NFC異常:','').trim();let items=ni.split(', ');let c=document.getElementById('nfc-container');c.innerHTML='';items.forEach(x=>{let m=x.match(/(.*?)\s*\((Box:\s*(.*?))\)\s*\[狀態:(.*?)\]/);if(m){let tN=m[1].trim(),bS=m[3],st=m[4].trim(),bs=bS.split(',').map(b=>b.trim());let cH=['Box 1','Box 2','Box 3','Box 5','Box 6','ALL'].map(b=>`<label style="width:30%"><input type="checkbox" value="${b}" class="nfc-box" ${bs.includes(b)?'checked':''}> ${b}</label>`).join('');c.insertAdjacentHTML('beforeend',`<div class="issue-item nfc-item"><button type="button" class="btn-remove" onclick="this.parentElement.remove()">X</button><div class="issue-row"><input type="text" class="table-num nfc-table" value="${tN}"></div><div class="checkbox-group" style="background:transparent;border:none;padding:0;margin-top:5px;gap:5px">${cH}</div><div class="issue-row" style="margin-top:8px"><select class="issue-status"><option value="已處理" ${st==='已處理'?'selected':''}>已處理</option><option value="已 Send mail" ${st==='已 Send mail'?'selected':''}>已 Send mail</option><option value="已通知相關部門跟進" ${st==='已通知相關部門跟進'?'selected':''}>已通知相關部門跟進</option><option value="待處理" ${st==='待處理'?'selected':''}>待處理</option></select></div></div>`);}});}else{document.getElementById('nfc-status').value='無異常';document.getElementById('nfc-issue-group').style.display='none';document.getElementById('nfc-container').innerHTML=`<div class="issue-item nfc-item"><div class="issue-row"><input type="text" class="table-num nfc-table" placeholder="輸入數字(如0201)"></div><div class="checkbox-group" style="background:transparent;border:none;padding:0;margin-top:5px;gap:5px"><label style="width:30%"><input type="checkbox" value="Box 1" class="nfc-box"> Box 1</label><label style="width:30%"><input type="checkbox" value="Box 2" class="nfc-box"> Box 2</label><label style="width:30%"><input type="checkbox" value="Box 3" class="nfc-box"> Box 3</label><label style="width:30%"><input type="checkbox" value="Box 5" class="nfc-box"> Box 5</label><label style="width:30%"><input type="checkbox" value="Box 6" class="nfc-box"> Box 6</label><label style="width:30%"><input type="checkbox" value="ALL" class="nfc-box"> ALL</label></div><div class="issue-row" style="margin-top:8px"><select class="issue-status"><option value="已處理" selected>已處理</option><option value="已 Send mail">已 Send mail</option><option value="已通知相關部門跟進">已通知相關部門跟進</option><option value="待處理">待處理</option></select></div></div>`;}}let pN=parseNote(r.note||"");document.getElementById('notes').value=pN.main;if(pN.venue){pN.venue.split('\n').forEach((ln,idx)=>{if(!ln.trim())return;let m=ln.match(/\[(.*?)\]\s*位置:\s*(.*?)\s*\[狀態:(.*?)\]/);if(m){let cp=m[1],cat='',prob='';let sk=Object.keys(venueCategories).sort((a,b)=>b.length-a.length);for(let k of sk){if(cp.startsWith(k+' - ')){cat=k;prob=cp.substring(k.length+3).trim();break;}}if(!cat){let ld=cp.lastIndexOf(' - ');if(ld!==-1){cat=cp.substring(0,ld).trim();prob=cp.substring(ld+3).trim();}else{cat=cp;prob='';}}let ls=m[2].trim(),st=m[3].trim();if(idx>0||(idx===0&&document.querySelector('.venue-loc-row input').value!==''))addVenueRow();let li=document.querySelectorAll('.venue-item')[document.querySelectorAll('.venue-item').length-1];let cs=li.querySelector('.venue-category'),ps=li.querySelector('.venue-problem');cs.style.flex='';ps.style.flex='';cs.value=cat;updateVenueProblem(cs);if(prob)ps.value=prob;let locs=ls.split(', '),vc=li.querySelector('.venue-location-container'),fi=vc.querySelector('.venue-location');if(fi)fi.value=locs[0]||'';for(let i=1;i<locs.length;i++){let nr=document.createElement('div');nr.className='issue-row venue-loc-row';nr.style.marginTop='5px';nr.style.position='relative';nr.innerHTML=`<input type="text" class="table-num venue-location" placeholder="輸入數字(如0201)" style="flex:1.5;margin-right:25px" value="${locs[i]}"><button type="button" class="btn-remove" style="right:0;top:8px" onclick="this.parentElement.remove()">X</button>`;vc.appendChild(nr);}let ss=li.querySelector('.issue-status');if(ss)ss.value=st;}});}transformInputs();loadPendingIssues();alert("📝 已為你載入原有資料。\n請喺下方修改後重新提交。");}
function deleteRecord(id){if(confirm("⚠️ 你確定要刪除這條交更紀錄嗎？刪除後無法復原！")){fetch('/api/delete_record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})}).then(r=>r.json()).then(d=>{alert(d.message);if(d.status==='success')showList();}).catch(e=>alert("❌ 連線失敗，請稍後再試。"));}}
function submitForm(){let pCbs=document.querySelectorAll('.pending-checkbox');let hU=false;let dOld=[],pOld=[];pCbs.forEach(c=>{if(c.offsetParent!==null){let txt=c.getAttribute('data-text');if(c.checked)dOld.push(txt);else{pOld.push(txt);hU=true;}}});if(hU){let isConf=document.getElementById('confirm-pending').checked;if(!isConf){alert("⚠️ 請注意：仲有未完成嘅跟進項目！\n\n如果你確定呢啲問題仍然未處理，請喺最底撳『我確定未打勾的項目仍然未處理』個格仔，然後再提交。");return;}}let fN=document.getElementById('notes').value;if(dOld.length)fN+=`\n\n【早前已處理】\n`+dOld.join('\n');if(pOld.length)fN+=`\n\n【早前未處理】\n`+pOld.join('\n');let lI="";if(document.getElementById('lux-issue-group').style.display==='block'){lI=Array.from(document.querySelectorAll('.lux-item')).map(i=>{let st=i.querySelector('.issue-status').value;let bS=[];if(i.querySelector('.lux-box1').value)bS.push(`Box 1: ${i.querySelector('.lux-box1').value}`);if(i.querySelector('.lux-box3').value)bS.push(`Box 3: ${i.querySelector('.lux-box3').value}`);if(i.querySelector('.lux-box6').value)bS.push(`Box 6: ${i.querySelector('.lux-box6').value}`);return (i.querySelector('.lux-table').value||bS.length>0)?`${i.querySelector('.lux-table').value} (${bS.join(', ')}) [狀態:${st}]`:"";}).filter(Boolean).join(' | ');}let tI="";if(document.getElementById('temp-issue-group').style.display==='block'){tI=Array.from(document.querySelectorAll('.temp-item')).map(i=>{let st=i.querySelector('.issue-status').value;return (i.querySelector('.temp-table').value||i.querySelector('.temp-value').value)?`${i.querySelector('.temp-table').value} (數值: ${i.querySelector('.temp-value').value}) [狀態:${st}]`:"";}).filter(Boolean).join(' | ');}let bI="";if(document.getElementById('bgm-issue-group').style.display==='block'){bI=Array.from(document.querySelectorAll('.bgm-item')).map(i=>{let st=i.querySelector('.issue-status').value;return (i.querySelector('.bgm-table').value||i.querySelector('.bgm-value').value)?`${i.querySelector('.bgm-table').value} (數值: ${i.querySelector('.bgm-value').value}) [狀態:${st}]`:"";}).filter(Boolean).join(' | ');}let vIss=[];let hEV=false;document.querySelectorAll('.venue-item').forEach(i=>{let c=i.querySelector('.venue-category').value,p=i.querySelector('.venue-problem').value,st=i.querySelector('.issue-status').value,l=[];i.querySelectorAll('.venue-loc-row').forEach(r=>{let t=r.querySelector('.venue-location').value;if(t)l.push(`${t}`);});if(c){if(l.length>0)vIss.push(`[${c} - ${p}] 位置: ${l.join(', ')} [狀態:${st}]`);else hEV=true;}});if(vIss.length)fN+=`\n\n【場面問題】\n`+vIss.join('\n');let sH=document.getElementById('nfc-hall-select').value,nD=[];if(document.getElementById('nfc-status').value==='有異常'){document.querySelectorAll('.nfc-item').forEach(i=>{let nt=i.querySelector('.nfc-table').value,bA=[];i.querySelectorAll('.nfc-box:checked').forEach(c=>bA.push(c.value));if(nt||bA.length>0){let bS=bA.length>0?`Box: ${bA.join(', ')}`:'未選Box';let st=i.querySelector('.issue-status').value;nD.push(`${nt} (${bS}) [狀態:${st}]`);}});}let nCA=[`NFC正常: ${sH}`];if(nD.length)nCA.push(`NFC異常: ${nD.join(', ')}`);let cS=nCA.join(' | ');let oS="已處理";document.querySelectorAll('.issue-status').forEach(s=>{if(s.value==="待處理")oS="待處理";});if(oS==="已處理"){document.querySelectorAll('.issue-status').forEach(s=>{if(s.value==="已通知相關部門跟進")oS="已通知相關部門跟進";else if(s.value==="已 Send mail")oS="已 Send mail";});}let data={name:document.getElementById('staffName').value,shift:document.getElementById('shiftType').value,lux:document.getElementById('skip-lux').checked?"":document.getElementById('lux').value,temp:document.getElementById('skip-temp').checked?"":document.getElementById('temp').value,bgm:document.getElementById('skip-bgm').checked?"":document.getElementById('bgm').value,checklist:document.getElementById('skip-nfc').checked?"":cS,status:oS,follower:Array.from(document.querySelectorAll('.follower-item:checked')).map(c=>c.value).join(', ')||'無',note:fN,lux_issue:document.getElementById('skip-lux').checked?"":lI,temp_issue:document.getElementById('skip-temp').checked?"":tI,db_issue:document.getElementById('skip-bgm').checked?"":bI};if(!data.name){alert("請選擇交更人！");return;}let rN=document.getElementById('notes').value.trim();if(!editingRecordId&&rN===''&&vIss.length===0&&lI===''&&tI===''&&bI===''&&nD.length===0&&dOld.length===0){if(hEV){if(!confirm("⚠️ 你選擇了場面問題，但沒有填寫「位置」。\n\n系統會忽略該項，確定要繼續提交嗎？"))return;}else{if(!confirm("⚠️ 你沒有填寫任何實質的交更內容，確定要提交這份空白紀錄嗎？"))return;}}if(editingRecordId){data.old_id=editingRecordId;fetch('/api/overwrite_record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(r=>r.json()).then(res=>{if(res.status==='success'){alert("✅ 修改成功！");editingRecordId=null;localStorage.removeItem('bs_shift_draft');showList();}else{alert(res.message||"修改失敗");}}).catch(e=>alert("❌ 修改連線失敗！\n可能係伺服器未準備好，請重新整理頁面再試。"));return;}fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(r=>r.json()).then(res=>{if(res.status==='success'){alert("✅ "+data.name+" 交更成功！");resetForm(true);showList();}else{alert(res.message||"提交失敗");}}).catch(e=>alert("❌ 提交連線失敗！\n可能係 Render 伺服器正在喚醒（需時約 30 秒），或者微信網絡攔截。\n\n請稍等一陣，然後重新整理網頁再試一次，或者改用「在瀏覽器打開」。"));}
