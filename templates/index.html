                '<div style="text-align:center;color:#aaa;font-size:12px;padding:6px 0 0;">正在載入歷史紀錄…</div>';
        }
        let dateFilter = (document.getElementById('list-date-filter') || {}).value || '';
        let keyword = ((document.getElementById('list-kw') || {}).value || '').trim();

        let qs = new URLSearchParams();
        qs.set('limit', String(window.__listLimit || 60));
        if (dateFilter) { qs.set('from', dateFilter); qs.set('to', dateFilter); }
        if (keyword) qs.set('q', keyword);

        fetch('/api/records_home?' + qs.toString()).then(res => res.json()).then(data => {
            let records = (data && data.records) ? data.records : [];
            let total = (data && typeof data.total === 'number') ? data.total : records.length;
            allRecords = records;
            let listDiv = document.getElementById('recordList');
            listDiv.setAttribute('data-loaded', '1');

            let countEl = document.getElementById('list-count');
            if (countEl) {
                if (dateFilter || keyword) {
                    let cond = [];
                    if (dateFilter) cond.push(dateFilter);
                    if (keyword) cond.push('「' + keyword + '」');
                    countEl.textContent = '找到 ' + total + ' 筆' + (cond.length ? '｜條件：' + cond.join(' ＋ ') : '');
                } else {
                    countEl.textContent = '共 ' + total + ' 筆紀錄' + (total > records.length ? '（顯示最近 ' + records.length + ' 筆）' : '');
                }
            }

            if (records.length === 0) {
                let cond = [];
                if (dateFilter) cond.push('日期 ' + dateFilter);
                if (keyword) cond.push('關鍵字「' + escapeText(keyword) + '」');
                listDiv.innerHTML = cond.length
                    ? "<p style='color: #888; text-align: center;'>" + cond.join(' ＋ ') + " 沒有符合的紀錄。</p>"
                    : "<p style='color: #888; text-align: center;'>暫時未有紀錄。</p>";
                return;
            }
            let html = "";
            
            records.forEach((r, index) => {
                let doneIssuesList = []; 
                let pendingIssuesList = [];
                let doneOldHtml = ""; 
                
                let processIssue = (text, defaultPrefix) => { 
                    if (!text) return; 
                    let match = text.match(/\[狀態:(.*?)\]/); 
                    let status = match ? match[1] : '待處理'; 
                    let cleanText = text.replace(/\[狀態:.*?\]/g, '').trim(); 
                    if (status === '已處理') { 
                        doneIssuesList.push(formatIssueText(cleanText, defaultPrefix, status)); 
                    } else { 
                        pendingIssuesList.push(formatIssueText(cleanText, defaultPrefix, status)); 
                    } 
                };
                
                if (r.lux_issue) processIssue(r.lux_issue, 'Lux -'); 
                if (r.temp_issue) processIssue(r.temp_issue, '溫度 -'); 
                if (r.db_issue) processIssue(r.db_issue, '分貝 -');
                
                let checkItemsHtml = ''; 
                if (r.checklist) { 
                    let items = r.checklist.split(' | '); 
                    items.forEach(item => { 
                        if (item.includes('異常')) splitNfcDetails(item.replace(/^NFC異常[:：]\s*/, '')).forEach(d => processIssue(d, 'NFC -')); 
                    }); 
                }
                
                // ===== 顯示本更檢測範圍（Hall）及四大項目完成情況 =====
                let hallInfoHtml = '';
                if (r.checklist) {
                    let hallSeg = r.checklist.split(' | ').find(s => s.includes('NFC正常'));
                    if (hallSeg) {
                        let hallName = hallSeg.replace(/^NFC正常[:：]\s*/, '').trim();
                        if (hallName) {
                            let hasNfcIssue = r.checklist.includes('NFC異常');
                            let chip = (label, ok) => `<span style="display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; white-space:nowrap; background:${ok ? '#e6f4ea' : '#f1f3f4'}; color:${ok ? '#137333' : '#5f6368'}; border:1px solid ${ok ? '#b7e1cd' : '#dadce0'};">${ok ? '✅' : '—'} ${label}</span>`;
                            hallInfoHtml = `<div class="record-data" style="background:#e8f0fe; color:#174ea6; font-size:13px; line-height:1.6;">
                                <div style="font-weight:bold; word-break:break-word; margin-bottom:6px;">🛰️ 本更檢測 Hall：${hallName} <span style="background:#1a73e8; color:#fff; padding:2px 8px; border-radius:10px; font-size:11px; white-space:nowrap; margin-left:4px;">✅ 已完成</span></div>
                                <div style="display:flex; flex-wrap:wrap; gap:5px;">${chip('Lux', !!r.lux)}${chip('溫度', !!r.temp)}${chip('分貝', !!r.bgm)}${chip('NFC', true)}</div>
                                ${hasNfcIssue ? `<div style="font-size:11px; color:#856404; margin-top:6px;">※ 以下僅列出 ${hallName} 內發現異常的個別台號，並非整個 Hall 均有異常。</div>` : ''}
                            </div>`;
                        }
                    }
                }

                let parsedNote = parseNote(r.note || "");
                let mainNote = parsedNote.main;
                
                if (parsedNote.venue) {
                    parsedNote.venue.split('\n').forEach(line => {
                        line = line.trim();
                        if (line && !line.startsWith('⚠️') && !line.startsWith('✅')) {
                            processIssue(line, '場面 -');
                        }
                    });
                }
                
                if (parsedNote.doneOld) {
                    parsedNote.doneOld.split('\n').forEach(line => {
                        line = line.replace(/\s*\[狀態:.*?\]/g, '').trim();
                            if (line) doneOldHtml += `<div class="issue-data" style="background:#e8f5e9; color:#2e7d32; padding:8px; margin-bottom:5px; border-radius:4px;"><span>✅ 舊問題已處理: ${line}</span></div>`;
                    });
                }

                if (parsedNote.pendingOld) {
                    parsedNote.pendingOld.split('\n').forEach(line => {
                        line = line.trim();
                        if (line) pendingIssuesList.push(formatIssueText(line.replace(/\s*\[狀態:.*?\]/g, '').trim(), '', '未處理'));
                    });
                }

                let timeStr = r.created_at ? `<div style="font-size: 12px; color: #888; font-weight: normal; margin-top: 4px;">🕒 ${fmtDateTime(r.created_at)}</div>` : "";
                let luxStr = (!r.lux_issue && r.lux !== '450-650') ? `Lux: ${r.lux}` : 'Lux數值大致在於450-650之間';
                let tempStr = (r.temp === '正常 (22.5-24.5)' || r.temp === '正常' || r.temp_issue) ? '溫度數值大致在於 22.5°-24.5°' : `溫度: ${r.temp}`;
                let bgmStr = (r.bgm === '正常 (65-75)' || r.bgm === '正常' || r.db_issue) ? '分貝數值大致在於 65-75' : `分貝: ${r.bgm}`;
                let dataHtml = `<div class="record-data">📊 ${luxStr} | ${tempStr} | ${bgmStr}</div>`;
                
                let followerHtml = ''; 
                if (r.follower && r.follower !== '無') { 
                    let names = r.follower.split(', '); 
                    let iconsHtml = names.map(name => { 
                        let iconColor = (name.includes('Carman') || name.includes('Stella')) ? '#e91e63' : '#1a73e8'; 
                        return `<span style="margin-right: 8px; font-weight: bold; color: ${iconColor};"><svg viewBox="0 0 24 24" width="14" height="14" fill="${iconColor}" style="vertical-align: text-top; margin-right: 2px;"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>${name}</span>`; 
                    }).join(''); 
                    followerHtml = `<div class="record-data" style="background:#fff3cd; color:#856404; display:flex; align-items:center;">👤 跟進人: <div style="margin-left:5px;">${iconsHtml}</div></div>`; 
                }
                
                let divider = index > 0 ? `<hr style="border: 0; height: 8px; background: #d1d5db; margin: 30px 0; border-radius: 4px;">` : "";
                
                let feedbackHtml = feedbackCardHtml('👥 客人意見收集', r.guest_feedback, '#f3e5f5', '#ce93d8', '#6a1b9a') + feedbackCardHtml('👥 DLR 意見收集', r.dlr_feedback, '#e0f2f1', '#80cbc4', '#00695c');

                let buttonsHtml = `<button onclick="editRecord(${r.id})" style="background: #f5b041; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 5px;">✏️ 修改</button>`;
                if (isAdmin) {
                    buttonsHtml += `<button onclick="deleteRecord(${r.id})" style="background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;">×️ 刪除</button>`;
                }

                let pendingBlock = '';
                if (pendingIssuesList.length > 0) {
                    pendingBlock = `<details open style="margin-top:8px;">
                        <summary style="cursor:pointer; font-size:13px; font-weight:bold; color:#c62828; padding:7px 9px; background:#fff5f5; border:1px solid #ffd9d9; border-radius:6px;">⚠️ 未處理項目（${pendingIssuesList.length} 項）</summary>
                        <div style="margin-top:6px;">${pendingIssuesList.join('')}</div>
                    </details>`;
                }
                let noIssueBlock = '';
                if (pendingIssuesList.length === 0 && doneIssuesList.length === 0 && !doneOldHtml) {
                    noIssueBlock = `<div style="margin-top:8px; background:#f1fbf4; border:1px solid #c8ecd5; border-radius:6px; padding:9px 10px; font-size:12px; color:#2e7d32;">✅ 本更未發現異常項目</div>`;
                }
                let doneBlock = '';
                if (doneIssuesList.length > 0 || doneOldHtml) {
                    doneBlock = `<details style="margin-top:8px;">
                        <summary style="cursor:pointer; font-size:13px; font-weight:bold; color:#2e7d32; padding:7px 9px; background:#f1fbf4; border:1px solid #c8ecd5; border-radius:6px;">✅ 已處理項目（${doneIssuesList.length} 項）</summary>
                        <div style="margin-top:6px;">${doneIssuesList.join('')}${doneOldHtml}</div>
                    </details>`;
                }

                let hallShort = '';
                if (r.checklist) {
                    let seg = r.checklist.split(' | ').find(x => x.includes('NFC正常'));
                    if (seg) hallShort = seg.replace(/^NFC正常[:：]\s*/, '').trim();
                }
                let quickInfo = (hallShort ? ('🛰️ ' + hallShort) : '無需檢測 Hall');
                let pendInfo = pendingIssuesList.length > 0
                    ? ('⚠️ ' + pendingIssuesList.length + ' 項未處理')
                    : '✅ 全部已處理';

                html += `${divider}<div class="record-card">
                    <div class="record-header" style="background: #f8f9fa; padding: 10px; border-radius: 6px 6px 0 0; margin: -15px -15px 15px -15px; border-bottom: 2px solid #1a73e8;">
                        <div style="flex: 1; min-width: 0;">
                            <strong style="font-size: 16px; word-break: break-word;">${r.name} (${r.shift})</strong>${timeStr}
                        </div>
                        <div style="display: flex; flex-shrink: 0; gap: 5px; align-items: center;">
                            ${buttonsHtml}
                        </div>
                    </div>
                    <details${index === 0 ? ' open' : ''} style="margin-top: 4px;">
                        <summary style="cursor: pointer; font-size: 12px; color: #555; padding: 6px 2px; line-height: 1.6;">${quickInfo}｜${pendInfo}｜點擊展開詳細</summary>
                        <div style="margin-top: 8px;">${dataHtml}${hallInfoHtml}${feedbackHtml}${checkItemsHtml}${noIssueBlock}${doneBlock}${pendingBlock}${followerHtml}<div class="record-note" style="margin-top: 10px;">${mainNote}</div></div>
                    </details></div>`;
            });
            listDiv.innerHTML = html;
            if (total > records.length) {
                let moreWrap = document.createElement('div');
                moreWrap.style.cssText = 'text-align:center;margin:12px 0 0;';
                moreWrap.innerHTML = '<button type="button" onclick="loadMoreRecords()" style="padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:13px;font-weight:bold;">載入更多（已顯示 ' + records.length + ' / ' + total + ' 筆）</button>';
                listDiv.appendChild(moreWrap);
            }
        }).catch(error => {
            console.error("讀取失敗:", error);
            let listDiv = document.getElementById('recordList');
            if (listDiv) {
                listDiv.innerHTML = '<div style="text-align:center;padding:18px 0;">' +
                    '<div style="color:#c0392b;font-size:13px;margin-bottom:10px;">⚠️ 讀取紀錄失敗（伺服器可能正在喚醒）</div>' +
                    '<button onclick="displayRecords()" style="padding:9px 16px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:13px;font-weight:bold;">🔄 重新載入</button></div>';
            }
        });
    }

    let searchTimer = null;
    window.__listLimit = 60;

    function loadMoreRecords() {
        window.__listLimit = (window.__listLimit || 60) + 60;
        displayRecords();
    }

    function debouncedSearch() {
        clearTimeout(searchTimer);
        window.__listLimit = 60;
        searchTimer = setTimeout(displayRecords, 300);
    }

    function clearDateFilter() {
        let d = document.getElementById('list-date-filter');
        if (d) d.value = '';
        let k = document.getElementById('list-kw');
        if (k) k.value = '';
        window.__listLimit = 60;
        displayRecords();
    }

    function editRecord(id) {
        let r = allRecords.find(x => x.id == id);
        if (!r) return;
        
        resetForm(false);
        document.getElementById('list-container').style.display = 'none'; 
        document.getElementById('form-container').style.display = 'block'; 
        
        editingRecordId = id; 
        
        document.getElementById('staffName').value = r.name;
        document.getElementById('shiftType').value = r.shift;
        if (r.follower && r.follower !== '無') {
            let names = r.follower.split(', ');
            document.querySelectorAll('.follower-item').forEach(cb => { if (names.includes(cb.value)) cb.checked = true; });
        }

        if (!r.lux) {
            document.getElementById('skip-lux').checked = true;
            document.getElementById('lux-input-area').style.display = 'none';
        } else {
            document.getElementById('skip-lux').checked = false;
            document.getElementById('lux-input-area').style.display = 'block';
            document.getElementById('lux').value = r.lux;
            if (r.lux === '< 450' || r.lux === '> 650') {
                document.getElementById('lux-issue-group').style.display = 'block';
                if (r.lux_issue) {
                    let luxItems = r.lux_issue.split(' | ');
                    let container = document.getElementById('lux-container');
                    container.innerHTML = ''; 
                    luxItems.forEach(item => {
                        let match = item.match(/(.*?)\s*\((.*?)\)\s*\[狀態:(.*?)\]/);
                        if (match) {
                            let tableNum = match[1].trim();
                            let boxesStr = match[2];
                            let status = match[3].trim();
                            let b1 = '', b3 = '', b6 = '';
                            boxesStr.split(',').forEach(b => {
                                if (b.includes('Box 1:')) b1 = b.replace('Box 1:', '').trim();
                                if (b.includes('Box 3:')) b3 = b.replace('Box 3:', '').trim();
                                if (b.includes('Box 6:')) b6 = b.replace('Box 6:', '').trim();
                            });
                            container.insertAdjacentHTML('beforeend', `<div class="issue-item lux-item"><button type="button" class="btn-remove" onclick="this.parentElement.remove()">X</button><div class="issue-row"><input type="text" class="table-num lux-table" value="${tableNum}"></div><div class="box-row"><div class="box-item"><span>Box 1</span><input type="text" class="lux-box1" value="${b1}"></div><div class="box-item"><span>Box 3</span><input type="text" class="lux-box3" value="${b3}"></div><div class="box-item"><span>Box 6</span><input type="text" class="lux-box6" value="${b6}"></div></div><div class="issue-row" style="margin-top: 8px;"><select class="issue-status"><option value="已處理" ${status==='已處理'?'selected':''}>已處理</option><option value="已 Send mail" ${status==='已 Send mail'?'selected':''}>已 Send mail</option><option value="已通知相關部門跟進" ${status==='已通知相關部門跟進'?'selected':''}>已通知相關部門跟進</option><option value="待處理" ${status==='待處理'?'selected':''}>待處理</option></select></div></div>`);
                        }
                    });
                }
            } else {
                document.getElementById('lux-issue-group').style.display = 'none';
            }
        }

        if (!r.temp) {
            document.getElementById('skip-temp').checked = true;
            document.getElementById('temp-input-area').style.display = 'none';
        } else {
            document.getElementById('skip-temp').checked = false;
            document.getElementById('temp-input-area').style.display = 'block';
            document.getElementById('temp').value = r.temp;
            if (r.temp.includes('偏低') || r.temp.includes('偏高')) {
                document.getElementById('temp-issue-group').style.display = 'block';
                if (r.temp_issue) {
                    let items = r.temp_issue.split(' | ');
                    let container = document.getElementById('temp-container');
                    container.innerHTML = '';
                    items.forEach(item => {
                        let match = item.match(/(.*?)\s*\(數值:\s*(.*?)\)\s*\[狀態:(.*?)\]/);
                        if (match) {
                            let tableNum = match[1].trim();
                            let val = match[2].trim();
                            let status = match[3].trim();
                            container.insertAdjacentHTML('beforeend', `<div class="issue-item temp-item"><button type="button" class="btn-remove" onclick="this.parentElement.remove()">X</button><div class="issue-row"><input type="text" class="table-num temp-table" value="${tableNum}"><input type="text" class="value temp-value" value="${val}"></div><div class="issue-row" style="margin-top: 8px;"><select class="issue-status"><option value="已處理" ${status==='已處理'?'selected':''}>已處理</option><option value="已 Send mail" ${status==='已 Send mail'?'selected':''}>已 Send mail</option><option value="已通知相關部門跟進" ${status==='已通知相關部門跟進'?'selected':''}>已通知相關部門跟進</option><option value="待處理" ${status==='待處理'?'selected':''}>待處理</option></select></div></div>`);
                        }
                    });
                }
            } else {
                document.getElementById('temp-issue-group').style.display = 'none';
            }
        }

        if (!r.bgm) {
            document.getElementById('skip-bgm').checked = true;
            document.getElementById('bgm-input-area').style.display = 'none';
        } else {
            document.getElementById('skip-bgm').checked = false;
            document.getElementById('bgm-input-area').style.display = 'block';
            document.getElementById('bgm').value = r.bgm;
            if (r.bgm.includes('偏低') || r.bgm.includes('偏高')) {
                document.getElementById('bgm-issue-group').style.display = 'block';
                if (r.db_issue) {
                    let items = r.db_issue.split(' | ');
                    let container = document.getElementById('bgm-container');
                    container.innerHTML = '';
                    items.forEach(item => {
                        let match = item.match(/(.*?)\s*\(數值:\s*(.*?)\)\s*\[狀態:(.*?)\]/);
                        if (match) {
                            let tableNum = match[1].trim();
                            let val = match[2].trim();
                            let status = match[3].trim();
                            container.insertAdjacentHTML('beforeend', `<div class="issue-item bgm-item"><button type="button" class="btn-remove" onclick="this.parentElement.remove()">X</button><div class="issue-row"><input type="text" class="table-num bgm-table" value="${tableNum}"><input type="text" class="value bgm-value" value="${val}"></div><div class="issue-row" style="margin-top: 8px;"><select class="issue-status"><option value="已處理" ${status==='已處理'?'selected':''}>已處理</option><option value="已 Send mail" ${status==='已 Send mail'?'selected':''}>已 Send mail</option><option value="已通知相關部門跟進" ${status==='已通知相關部門跟進'?'selected':''}>已通知相關部門跟進</option><option value="待處理" ${status==='待處理'?'selected':''}>待處理</option></select></div></div>`);
                        }
                    });
                }
            } else {
                document.getElementById('bgm-issue-group').style.display = 'none';
            }
        }

        if (!r.checklist) {
            document.getElementById('skip-nfc').checked = true;
            document.getElementById('nfc-input-area').style.display = 'none';
        } else {
            document.getElementById('skip-nfc').checked = false;
            document.getElementById('nfc-input-area').style.display = 'block';
            let parts = r.checklist.split(' | ');
            let hallStr = parts.find(p => p.includes('NFC正常:'));
            let issueStr = parts.find(p => p.includes('NFC異常:'));
            if (hallStr) {
                let hall = hallStr.replace('NFC正常:', '').trim();
                document.getElementById('nfc-hall-select').value = hall;
            }
            if (issueStr) {
                document.getElementById('nfc-status').value = '有異常';
                document.getElementById('nfc-issue-group').style.display = 'block';
                
                let items = parts.filter(p => p.includes('NFC異常:'))
                    .flatMap(p => splitNfcDetails(p.replace(/^NFC異常[:：]\s*/, '').trim()));
                if (items.length === 0) items = splitNfcDetails(issueStr.replace(/^NFC異常[:：]\s*/, '').trim());
                let container = document.getElementById('nfc-container');
                container.innerHTML = '';
                items.forEach(item => {
                    let match = item.match(/(.*?)\s*\((Box:\s*(.*?))\)\s*\[狀態:(.*?)\]/);
                    if (match) {
                        let tableNum = match[1].trim();
                        let boxesStr = match[3];
                        let status = match[4].trim();
                        let boxes = boxesStr.split(',').map(b=>b.trim());
                        let chkHtml = ['Box 1','Box 2','Box 3','Box 5','Box 6','ALL'].map(b => `<label style="width:30%;"><input type="checkbox" value="${b}" class="nfc-box" ${boxes.includes(b)?'checked':''}> ${b}</label>`).join('');
                        container.insertAdjacentHTML('beforeend', `<div class="issue-item nfc-item"><button type="button" class="btn-remove" onclick="this.parentElement.remove()">X</button><div class="issue-row"><input type="text" class="table-num nfc-table" value="${tableNum}"></div><div class="checkbox-group" style="background:transparent; border:none; padding:0; margin-top:5px; gap:5px;">${chkHtml}</div><div class="issue-row" style="margin-top: 8px;"><select class="issue-status"><option value="已處理" ${status==='已處理'?'selected':''}>已處理</option><option value="已 Send mail" ${status==='已 Send mail'?'selected':''}>已 Send mail</option><option value="已通知相關部門跟進" ${status==='已通知相關部門跟進'?'selected':''}>已通知相關部門跟進</option><option value="待處理" ${status==='待處理'?'selected':''}>待處理</option></select></div></div>`);
                    }
                });
            } else {
                document.getElementById('nfc-status').value = '無異常';
                document.getElementById('nfc-issue-group').style.display = 'none';
                document.getElementById('nfc-container').innerHTML = `<div class="issue-item nfc-item"><div class="issue-row"><input type="text" class="table-num nfc-table" placeholder="輸入數字(如0201)"></div><div class="checkbox-group" style="background:transparent; border:none; padding:0; margin-top:5px; gap:5px;"><label style="width:30%;"><input type="checkbox" value="Box 1" class="nfc-box"> Box 1</label><label style="width:30%;"><input type="checkbox" value="Box 2" class="nfc-box"> Box 2</label><label style="width:30%;"><input type="checkbox" value="Box 3" class="nfc-box"> Box 3</label><label style="width:30%;"><input type="checkbox" value="Box 5" class="nfc-box"> Box 5</label><label style="width:30%;"><input type="checkbox" value="Box 6" class="nfc-box"> Box 6</label><label style="width:30%;"><input type="checkbox" value="ALL" class="nfc-box"> ALL</label></div><div class="issue-row" style="margin-top: 8px;"><select class="issue-status"><option value="已處理" selected>已處理</option><option value="已 Send mail">已 Send mail</option><option value="已通知相關部門跟進">已通知相關部門跟進</option><option value="待處理">待處理</option></select></div></div>`;
            }
        }

        let parsedNote = parseNote(r.note || "");
        document.getElementById('notes').value = parsedNote.main;
        applyFeedback('guest', r.guest_feedback);
        applyFeedback('dlr', r.dlr_feedback);
        
        if (parsedNote.venue) {
            parsedNote.venue.split('\n').forEach((line, index) => {
                if (!line.trim()) return;
                let match = line.match(/\[(.*?)\]\s*位置:\s*(.*?)\s*\[狀態:(.*?)\]/);
                if (match) {
                    let catProbStr = match[1];
                    let cat = '';
                    let prob = '';
                    let sortedKeys = Object.keys(venueCategories).sort((a,b) => b.length - a.length);
                    for (let key of sortedKeys) {
                        if (catProbStr.startsWith(key + ' - ')) {
                            cat = key;
                            prob = catProbStr.substring(key.length + 3).trim();
                            break;
                        }
                    }
                    if (!cat) {
                        let lastDash = catProbStr.lastIndexOf(' - ');
                        if (lastDash !== -1) {
                            cat = catProbStr.substring(0, lastDash).trim();
                            prob = catProbStr.substring(lastDash + 3).trim();
                        } else {
                            cat = catProbStr; prob = '';
                        }
                    }

                    let locsStr = match[2].trim();
                    let status = match[3].trim();
                    
                    if (index > 0 || (index === 0 && document.querySelector('.venue-loc-row input').value !== '')) { addVenueRow(); }
                    let lastItem = document.querySelectorAll('.venue-item')[document.querySelectorAll('.venue-item').length - 1];
                    let catSelect = lastItem.querySelector('.venue-category');
                    let probSelect = lastItem.querySelector('.venue-problem');
                    
                    catSelect.style.flex = ""; 
                    probSelect.style.flex = "";

                    catSelect.value = cat; updateVenueProblem(catSelect); if (prob) probSelect.value = prob;
                    
                    let locs = locsStr.split(', ');
                    let venueContainer = lastItem.querySelector('.venue-location-container');
                    let firstLocInput = venueContainer.querySelector('.venue-location');
                    if (firstLocInput) firstLocInput.value = locs[0] || '';
                    
                    for (let i = 1; i < locs.length; i++) {
                        let newRow = document.createElement('div');
                        newRow.className = 'issue-row venue-loc-row';
                        newRow.style.marginTop = '5px';
                        newRow.style.position = 'relative';
                        newRow.innerHTML = `<input type="text" class="table-num venue-location" placeholder="輸入數字(如0201)" style="flex: 1.5; margin-right: 25px;" value="${locs[i]}"><button type="button" class="btn-remove" style="right: 0; top: 8px;" onclick="this.parentElement.remove()">X</button>`;
                        venueContainer.appendChild(newRow);
                    }
                    
                    let statusSelect = lastItem.querySelector('.issue-status'); 
                    if (statusSelect) statusSelect.value = status;
                }
            });
        }
        transformInputs();
        loadPendingIssues();
        alert("📝 已載入原有資料。\n請於下方修改後重新提交。");
    }

    function deleteRecord(id) { 
        if (confirm("⚠️ 你確定要刪除這條交更紀錄嗎？刪除後無法復原！")) { 
            fetch('/api/delete_record', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id }) })
            .then(res => res.json())
            .then(data => { 
                alert(data.message); 
                if (data.status === 'success') showList(); 
            })
            .catch(err => alert("❌ 連線失敗，請稍後再試。")); 
        } 
    }

    function submitForm() {
        let pendingCheckboxes = document.querySelectorAll('.pending-checkbox'); 
        let hasUnresolved = false; 
        let doneOldItems = []; 
        let pendingOldItems = [];
        
        pendingCheckboxes.forEach(cb => { 
            if (cb.offsetParent !== null) { 
                let text = cb.getAttribute('data-text'); 
                if (cb.checked) {
                    doneOldItems.push(text); 
                } else {
                    pendingOldItems.push(text); 
                    hasUnresolved = true; 
                }
            }
        });

        if (hasUnresolved) { 
            let isConfirmed = document.getElementById('confirm-pending').checked; 
            if (!isConfirmed) { 
                alert("⚠️ 請注意：仍有未完成的跟進項目。\n\n如確定該等問題仍未處理，請於頁面最下方勾選「我確定未打勾的項目仍然未處理」，然後再次提交。"); 
                return; 
            } 
        }
        
        let finalNote = document.getElementById('notes').value; 
        if (doneOldItems.length > 0) finalNote += `\n\n【早前已處理】\n` + doneOldItems.join('\n');
        if (pendingOldItems.length > 0) finalNote += `\n\n【早前未處理】\n` + pendingOldItems.join('\n');
        
        let luxIssue = ""; 
        if (document.getElementById('lux-issue-group').style.display === 'block') { 
            luxIssue = Array.from(document.querySelectorAll('.lux-item')).map(item => { 
                let status = item.querySelector('.issue-status').value; 
                let bStr = []; 
                if(item.querySelector('.lux-box1').value) bStr.push(`Box 1: ${item.querySelector('.lux-box1').value}`); 
                if(item.querySelector('.lux-box3').value) bStr.push(`Box 3: ${item.querySelector('.lux-box3').value}`); 
                if(item.querySelector('.lux-box6').value) bStr.push(`Box 6: ${item.querySelector('.lux-box6').value}`); 
                return (item.querySelector('.lux-table').value || bStr.length > 0) ? `${item.querySelector('.lux-table').value} (${bStr.join(', ')}) [狀態:${status}]` : ""; 
            }).filter(Boolean).join(' | '); 
        }
        
        let tempIssue = ""; 
        if (document.getElementById('temp-issue-group').style.display === 'block') { 
            tempIssue = Array.from(document.querySelectorAll('.temp-item')).map(item => { 
                let status = item.querySelector('.issue-status').value; 
                return (item.querySelector('.temp-table').value || item.querySelector('.temp-value').value) ? `${item.querySelector('.temp-table').value} (數值: ${item.querySelector('.temp-value').value}) [狀態:${status}]` : ""; 
            }).filter(Boolean).join(' | '); 
        }
        
        let dbIssue = ""; 
        if (document.getElementById('bgm-issue-group').style.display === 'block') { 
            dbIssue = Array.from(document.querySelectorAll('.bgm-item')).map(item => { 
                let status = item.querySelector('.issue-status').value; 
                return (item.querySelector('.bgm-table').value || item.querySelector('.bgm-value').value) ? `${item.querySelector('.bgm-table').value} (數值: ${item.querySelector('.bgm-value').value}) [狀態:${status}]` : ""; 
            }).filter(Boolean).join(' | '); 
        }
        
        let venueIssues = []; 
        let hasEmptyVenue = false;
        document.querySelectorAll('.venue-item').forEach(item => { 
            let cat = item.querySelector('.venue-category').value; 
            let prob = item.querySelector('.venue-problem').value; 
            let status = item.querySelector('.issue-status').value; 
            let locs = []; 
            item.querySelectorAll('.venue-loc-row').forEach(locRow => { 
                let t = locRow.querySelector('.venue-location').value; 
                if (t) locs.push(`${t}`); 
            }); 
            
            if (cat) {
                if (locs.length > 0) {
                    venueIssues.push(`[${cat} - ${prob}] 位置: ${locs.join(', ')} [狀態:${status}]`); 
                } else {
                    hasEmptyVenue = true;
                }
            }
        });
        
        if (venueIssues.length > 0) finalNote += `\n\n【場面問題】\n` + venueIssues.join('\n');
        
        let selectedHall = document.getElementById('nfc-hall-select').value; 
        let nfcDetails = []; 
        if(document.getElementById('nfc-status').value === '有異常') { 
            document.querySelectorAll('.nfc-item').forEach(item => { 
                let nfcTable = item.querySelector('.nfc-table').value; 
                let boxArray = []; 
                item.querySelectorAll('.nfc-box:checked').forEach(cb => boxArray.push(cb.value)); 
                if (nfcTable || boxArray.length > 0) { 
                    let boxStr = boxArray.length > 0 ? `Box: ${boxArray.join(', ')}` : '未選Box'; 
                    let status = item.querySelector('.issue-status').value; 
                    nfcDetails.push(`${nfcTable} (${boxStr}) [狀態:${status}]`); 
                } 
            }); 
        }
        
        let nfcChecklistArray = [`NFC正常: ${selectedHall}`]; 
        if (nfcDetails.length > 0) nfcDetails.forEach(d => nfcChecklistArray.push(`NFC異常: ${d}`)); 
        let checklistString = nfcChecklistArray.join(' | ');
        
        let overallStatus = "已處理"; 
        document.querySelectorAll('.issue-status').forEach(sel => { if(sel.value === "待處理") overallStatus = "待處理"; }); 
        if(overallStatus === "已處理") { 
            document.querySelectorAll('.issue-status').forEach(sel => { 
                if(sel.value === "已通知相關部門跟進") overallStatus = "已通知相關部門跟進"; 
                else if(sel.value === "已 Send mail") overallStatus = "已 Send mail"; 
            }); 
        }
        
        let data = { 
            name: document.getElementById('staffName').value, 
            shift: document.getElementById('shiftType').value, 
            lux: document.getElementById('skip-lux').checked ? "" : document.getElementById('lux').value, 
            temp: document.getElementById('skip-temp').checked ? "" : document.getElementById('temp').value, 
            bgm: document.getElementById('skip-bgm').checked ? "" : document.getElementById('bgm').value, 
            checklist: document.getElementById('skip-nfc').checked ? "" : checklistString, 
            status: overallStatus, 
            follower: Array.from(document.querySelectorAll('.follower-item:checked')).map(cb => cb.value).join(', ') || '無', 
            note: finalNote, 
            guest_feedback: collectFeedback('guest'),
            dlr_feedback: collectFeedback('dlr'),
            lux_issue: document.getElementById('skip-lux').checked ? "" : luxIssue, 
            temp_issue: document.getElementById('skip-temp').checked ? "" : tempIssue, 
            db_issue: document.getElementById('skip-bgm').checked ? "" : dbIssue 
        };
        
        if (!data.name) { alert("請選擇交更人！"); return; }
        
        let rawNote = document.getElementById('notes').value.trim(); 
        if (!editingRecordId && rawNote === '' && venueIssues.length === 0 && luxIssue === '' && tempIssue === '' && dbIssue === '' && nfcDetails.length === 0 && doneOldItems.length === 0) { 
            if (hasEmptyVenue) {
                if (!confirm("⚠️ 已選擇場面問題，但未填寫「位置」。\n\n系統會忽略該項，確定要繼續提交嗎？")) return;
            } else {
                if (!confirm("⚠️ 你沒有填寫任何實質的交更內容，確定要提交這份空白紀錄嗎？")) return;
            }
        }
        
        if (isSubmitting) return;
        setSubmitting(true);

        if (editingRecordId) { 
            data.old_id = editingRecordId; 
            fetch('/api/overwrite_record', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
            .then(res => res.json())
            .then(res => { 
                setSubmitting(false);
                if (res.status === 'success') { 
                    alert("✅ 修改成功！"); 
                    editingRecordId = null; 
                    localStorage.removeItem('bs_shift_draft'); 
                    showList(); 
                } else { 
                    alert(res.message || "修改失敗"); 
                } 
            })
            .catch(err => { setSubmitting(false); alert("❌ 修改連線失敗！\n可能伺服器尚未準備好，請重新整理頁面再試。"); }); 
            return; 
        }
        
        fetch('/api/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
        .then(res => res.json())
        .then(res => { 
            setSubmitting(false);
            if (res.status === 'success') { 
                alert("✅ " + data.name + " 交更成功！"); 
                resetForm(true); 
                showList(); 
            } else { 
                alert(res.message || "提交失敗"); 
            } 
        })
        .catch(error => {
            setSubmitting(false);
            alert("❌ 提交連線失敗！\n可能係 Render 伺服器正在喚醒（需時約 30 秒），或者微信網絡攔截。\n\n請稍後重新整理網頁再試，或改用「在瀏覽器打開」。");
        }); 
    }

    document.addEventListener("DOMContentLoaded", function() { 
        showList(); 
        fetch('/api/get_configs?_t=' + Date.now()).then(res => res.json()).then(data => { 
            venueCategories = data; 
            let firstVenue = document.querySelector('.venue-category'); 
            if(firstVenue) initVenueCategory(firstVenue); 
            transformInputs(); 
        }).catch(err => { 
            console.error(err); 
            transformInputs(); 
        }); 
        
        document.getElementById('form-container').addEventListener('input', debouncedSaveDraft);
        document.getElementById('form-container').addEventListener('change', debouncedSaveDraft);
    });
    </script>
</body>
</html>
